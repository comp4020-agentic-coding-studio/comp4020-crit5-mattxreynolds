<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A-iso slice — start / play / lost</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#3c4a38;--card:#dfa561;--red:#d64a3c;--white:#fdfdfa;
  --s1:8px;--s2:16px;--s3:24px;--s4:32px;--s6:48px;
  --cw:clamp(64px,8.6vmin,112px)}
html,body{height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#e6f1e8 0%,#eef2e6 46%,#f8f2e6 100%)}
.screen{display:none;position:relative;height:100%;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--s6);padding:var(--s3) var(--s2) var(--s2)}
.screen.on{display:flex}
/* the bar pins to the viewport gutters, so its relation to the board no longer
   inverts between a 3x3 level and a 5x4 one */
.top-bar{position:absolute;top:var(--s3);left:var(--s3);right:var(--s3);
  display:flex;align-items:center;justify-content:space-between;z-index:30}
.top-bar.bare .redo{visibility:hidden}   /* one restart on screen at a time */
.lvl{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.72);
  display:grid;place-items:center;font-weight:900;font-size:24px;color:#54634e}
.stage{flex:0 0 auto;display:grid;place-items:center;width:100%;position:relative}
.b33{--w:min(calc((100vw - 96px)/3), calc((100vh - 320px)/1.800), 260px)}
.b54{--w:min(calc((100vw - 96px)/4.5), calc((100vh - 320px)/2.550), 260px)}
@media (max-width:700px){.b33{--w:min(calc((100vw - 24px)/3), calc((100vh - 264px)/1.800), 150px)}}
@media (max-width:700px){.b54{--w:min(calc((100vw - 24px)/4.5), calc((100vh - 264px)/2.550), 150px)}}
.board{position:relative;--lift:calc(var(--w)*0.30);
  --hw:calc(var(--w)/2);--h:calc(var(--w)/2);--hh:calc(var(--w)/4);
  --d:calc(var(--w)*0.13);--rise:calc(var(--w)*0.17);
  width:calc(var(--w)*(var(--cols) + var(--rows))/2);
  height:calc(var(--hh)*(var(--cols) + var(--rows) - 2) + var(--h) + var(--d));
  filter:drop-shadow(0 18px 26px rgba(70,90,66,.20));transition:opacity .3s}
.board.dim{opacity:.6}     /* you must still be able to read the position you lost from */
.t{position:absolute;z-index:calc(var(--r) + var(--c));
  --lv:0;--dd:calc(var(--d) + var(--lv)*var(--lift));
  --rn:0px;--re:0px;--rs:0px;--rw:0px;--rmax:0px;
  left:calc((var(--c) - var(--r)) * var(--hw) + var(--hw)*(var(--rows) - 1));
  top:calc((var(--c) + var(--r)) * var(--hh) - (var(--dd) - var(--d)) - var(--rmax));
  width:var(--w);height:calc(var(--h) + var(--dd) + var(--rmax));
  --yN:calc(var(--rmax) - var(--rn));
  --yE:calc(var(--hh) + var(--rmax) - var(--re));
  --yS:calc(var(--h)  + var(--rmax) - var(--rs));
  --yW:calc(var(--hh) + var(--rmax) - var(--rw));
  --yEb:calc(var(--hh) + var(--rmax) + var(--dd));
  --yWb:calc(var(--hh) + var(--rmax) + var(--dd));
  --ySb:calc(var(--h)  + var(--rmax) + var(--dd));
  --tl:min(var(--yW), var(--yS));
  --tr:min(var(--yS), var(--yE));
  --poly:polygon(50% var(--yN), 100% var(--yE), 50% var(--yS), 0 var(--yW))}
.top,.fl,.fr,.fx{position:absolute}
.top{left:0;top:0;width:var(--w);height:calc(var(--h) + var(--rmax));clip-path:var(--poly)}
.top::after{content:"";position:absolute;inset:0;clip-path:var(--poly);transform:scale(.962)}
.fl{left:0;top:var(--tl);width:var(--hw);height:calc(var(--ySb) - var(--tl));
  clip-path:polygon(0 calc(var(--yW) - var(--tl)),100% calc(var(--yS) - var(--tl)),
                    100% calc(var(--ySb) - var(--tl)),0 calc(var(--yWb) - var(--tl)))}
.fr{left:var(--hw);top:var(--tr);width:var(--hw);height:calc(var(--ySb) - var(--tr));
  clip-path:polygon(0 calc(var(--yS) - var(--tr)),100% calc(var(--yE) - var(--tr)),
                    100% calc(var(--yEb) - var(--tr)),0 calc(var(--ySb) - var(--tr)))}
.fx{left:0;top:var(--rmax);width:var(--w);height:var(--h);z-index:2}
/* ONE height convention everywhere: higher ground is darker. */
.gr .top{background:#a3bb98}.gr .top::after{background:#b6ccab}
.gr .fl{background:#94ac8a}.gr .fr{background:#84997a}
.up .top{background:#7b9670}.up .top::after{background:#8ba580}
.up .fl{background:#6e8664}.up .fr{background:#5e7556}
.sd .top{background:#dbc899}
.sd .top::after{background:#eddcae radial-gradient(circle,rgba(180,150,90,.5) 1.4px,transparent 1.8px) 0 0/10px 10px}
.sd .fl{background:#cbb98b}.sd .fr{background:#b9a67b}
.sl{--rmax:var(--rise)}
.sl .top{background:#9db492}.sl .fl{background:#94ac8a}.sl .fr{background:#84997a}
.sl-pc{--rn:var(--rise);--rw:var(--rise)} .sl-nc{--re:var(--rise);--rs:var(--rise)}
.sl-pr{--rn:var(--rise);--re:var(--rise)} .sl-nr{--rs:var(--rise);--rw:var(--rise)}
.sl-pc .top::after{background:linear-gradient(150deg,#c6d8ba 0%,#9cb391 100%)}
.sl-nc .top::after{background:linear-gradient(330deg,#c6d8ba 0%,#9cb391 100%)}
.sl-pr .top::after{background:linear-gradient(210deg,#c6d8ba 0%,#9cb391 100%)}
.sl-nr .top::after{background:linear-gradient(30deg,#c6d8ba 0%,#9cb391 100%)}
/* Direction markers. A bare triangle sheared into the ground plane reads as a
   wedge converging on the ball, not as a heading -- the stem is what makes the
   direction of travel unambiguous. */
.pl{position:absolute;left:50%;top:50%;width:var(--w);height:var(--w);
  margin:calc(var(--w)/-2) 0 0 calc(var(--w)/-2);
  transform:matrix(1,.5,-1,.5,0,0);display:grid;place-items:center}
.pl.ar{display:none;transform:matrix(1,.5,-1,.5,0,0) rotate(var(--rot))}
.armed .pl.ar{display:grid}
.armed .t:has(.ar) .top{background:#bcd2b0}
.armed .t:has(.ar) .top::after{background:#d6e5cb}
.tri{position:relative;display:block;margin-left:calc(var(--w)*.10);
  width:calc(var(--w)*.30);height:calc(var(--w)*.085);border-radius:calc(var(--w)*.05);
  background:rgba(52,68,48,.88)}
.tri::after{content:"";position:absolute;left:100%;top:50%;transform:translateY(-50%);
  border-left:calc(var(--w)*.17) solid rgba(52,68,48,.88);
  border-top:calc(var(--w)*.145) solid transparent;border-bottom:calc(var(--w)*.145) solid transparent}
.cup{position:absolute;left:50%;top:50%;width:calc(var(--w)*.40);height:calc(var(--w)*.20);
  transform:translate(-50%,-50%);border-radius:50%;background:#41513c;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.flag{position:absolute;left:calc(50% + var(--w)*.02);bottom:50%;width:calc(var(--w)*.018);min-width:2px;
  height:calc(var(--w)*.46);background:#4a4a46;border-radius:2px;z-index:9}
.flag::after{content:"";position:absolute;left:100%;top:0;border-left:calc(var(--w)*.22) solid var(--red);
  border-top:calc(var(--w)*.085) solid transparent;border-bottom:calc(var(--w)*.085) solid transparent}
.shdw{position:absolute;left:50%;top:50%;width:calc(var(--w)*.34);height:calc(var(--w)*.17);
  transform:translate(-50%,-30%);border-radius:50%;background:rgba(60,80,56,.26)}
.ball{position:absolute;left:50%;top:50%;width:calc(var(--w)*.30);height:calc(var(--w)*.30);
  transform:translate(-50%,-72%);border-radius:50%;background:var(--white);z-index:8;
  box-shadow:inset -2px -3px 5px rgba(80,95,76,.20)}
.hand{display:flex;justify-content:center;align-items:flex-end}
.c{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:var(--s2);background:var(--card);
  margin:0 calc(var(--s1)*-1);position:relative;border:0;font:inherit;cursor:pointer;
  box-shadow:0 6px 12px rgba(90,70,40,.24),inset 0 -5px 0 rgba(0,0,0,.09);
  display:grid;place-items:center;transition:transform .16s,box-shadow .16s}
.c:nth-child(1){transform:rotate(-6deg)}.c:nth-child(3){transform:rotate(6deg)}
.hand .c:only-child{transform:none}
.c.sel{transform:translateY(calc(var(--s3)*-1)) rotate(0)!important;
  box-shadow:0 12px 20px rgba(90,70,40,.30),0 0 0 4px var(--white),inset 0 -5px 0 rgba(0,0,0,.09)}
.c.spent{background:#cdc7b6;opacity:.55;box-shadow:none;cursor:default}
.num{position:absolute;top:var(--s1);left:var(--s1);background:var(--white);color:#8a6236;
  font-weight:900;font-size:calc(var(--cw)*.32);line-height:1;padding:2px 8px;border-radius:8px}
.gl{width:56%;height:4px;background:rgba(255,255,255,.92);border-radius:3px;position:relative;margin-top:var(--s2)}
.gl::after{content:"";position:absolute;right:-3px;top:-6px;border-left:12px solid rgba(255,255,255,.92);
  border-top:8px solid transparent;border-bottom:8px solid transparent}
/* end-of-level. Sits where the hand sits rather than over the board, so the
   position you lost from stays readable. Not a <dialog>, no role=dialog, no
   "modal" in any class or id -- spec/crit-5.test.ts fails all of those. */
.endcard{display:flex;align-items:center;gap:var(--s4)}
.endcard .c{transform:none!important;margin:0 var(--s1) 0 0}
.endcard .c.spent{opacity:1;background:#bdb7a6;box-shadow:0 4px 10px rgba(90,70,40,.16)}
.endcard .c.spent .num{background:#f4f2ea;color:#5f5c51}
/* one restart component, two sizes */
.redo{width:72px;height:72px;border:0;border-radius:50%;background:var(--card);cursor:pointer;
  display:grid;place-items:center;box-shadow:0 8px 16px rgba(90,70,40,.28),inset 0 -5px 0 rgba(0,0,0,.10);
  transition:transform .15s}
.redo:hover{transform:translateY(-2px)}
.redo.sm{width:44px;height:44px;box-shadow:0 3px 8px rgba(90,70,40,.20),inset 0 -3px 0 rgba(0,0,0,.10)}
.redo svg{width:50%;height:50%;fill:none;stroke:#5b4526;stroke-width:2.6;stroke-linecap:round}
@media (max-width:700px){
  .screen{gap:var(--s4);padding:var(--s2) var(--s1)}
  .top-bar{top:var(--s2);left:var(--s2);right:var(--s2)}
  .endcard{gap:var(--s3)} .redo{width:60px;height:60px}
}
.sl.up .top{background:#7b9670}
.sl.up .top::after{background:linear-gradient(330deg,#8ba580 0%,#b6ccab 100%)}
.sl.up .fl{background:#94ac8a}.sl.up .fr{background:#84997a}
</style></head><body>

<script>
  const want = new URLSearchParams(location.search).get("s") || "start";
  const scr = document.querySelector('[data-s="' + want + '"]') || document.querySelector("[data-s]");
  scr.classList.add("on");
  scr.querySelectorAll(".hand .c:not(.spent)").forEach(function (card) {
    card.addEventListener("click", function () {
      const already = card.classList.contains("sel");
      scr.querySelectorAll(".hand .c").forEach(function (c) { c.classList.remove("sel"); });
      if (!already) card.classList.add("sel");
      scr.classList.toggle("armed", !already);
    });
  });
</script>
</body></html>
