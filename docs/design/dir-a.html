<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A — Floating stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --t:min(calc((100vw - 40px)/5), calc((100vh - 320px)/4), 168px);
  --ink:#3c4a38; --g1:#b4cbaa; --g2:#a8c29d; --wall:#7c9672; --sand:#eeda a8;
  --sand:#efdcac; --card:#dfa561; --red:#d64a3c; --white:#fdfdfa;
  --s:8px;
}
html,body{height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#e6f1e8 0%,#eef2e6 46%,#f8f2e6 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(var(--s)*3) var(--s) calc(var(--s)*2);overflow:hidden}
/* top */
.top{width:min(760px,100%);display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--s)*1.5)}
.lvl{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.6);
  display:grid;place-items:center;font-weight:900;font-size:19px;color:#5b6b55}
.rs{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px;color:#7d8a76}
.rs svg{width:20px;height:20px;fill:none;stroke:#7d8a76;stroke-width:2.4;stroke-linecap:round}
/* board */
.stage{flex:1;display:grid;place-items:center;width:100%}
.board{display:grid;grid-template-columns:repeat(5,var(--t));gap:3px;
  filter:drop-shadow(0 14px 22px rgba(70,90,66,.20))}
.tile{width:var(--t);height:var(--t);border-radius:7px;background:var(--g1);position:relative}
.tile:nth-child(even){background:var(--g2)}
.wall{background:var(--wall)!important;box-shadow:inset 0 5px 0 rgba(255,255,255,.30),inset 0 -4px 0 rgba(0,0,0,.10)}
.sand{background:var(--sand)!important}
.sand::after{content:"";position:absolute;inset:22%;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(190,160,95,.45) 1.5px,transparent 2px) 0 0/9px 9px}
.slope::after{content:"";position:absolute;left:32%;top:26%;width:0;height:0;
  border-left:calc(var(--t)*.34) solid rgba(255,255,255,.62);
  border-top:calc(var(--t)*.24) solid transparent;border-bottom:calc(var(--t)*.24) solid transparent}
.hole::after{content:"";position:absolute;inset:24%;border-radius:50%;background:#41513c;
  box-shadow:inset 0 3px 5px rgba(0,0,0,.45)}
.flag{position:absolute;left:52%;bottom:52%;width:2.5px;height:calc(var(--t)*.52);background:#4a4a46;z-index:3;border-radius:2px}
.flag::after{content:"";position:absolute;left:2.5px;top:0;border-left:calc(var(--t)*.26) solid var(--red);
  border-top:calc(var(--t)*.10) solid transparent;border-bottom:calc(var(--t)*.10) solid transparent}
.ball{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44%;height:44%;border-radius:50%;background:var(--white);z-index:4;
  box-shadow:0 3px 5px rgba(60,74,56,.35),inset 0 -3px 4px rgba(0,0,0,.06)}
.arw{display:grid;place-items:center}
.arw span{z-index:5;width:54%;height:54%;border-radius:50%;background:rgba(56,72,52,.82);
  display:grid;place-items:center;box-shadow:0 3px 8px rgba(40,54,38,.28)}
.arw span::before{content:"";margin-left:3px;border-left:calc(var(--t)*.13) solid #fff;
  border-top:calc(var(--t)*.093) solid transparent;border-bottom:calc(var(--t)*.093) solid transparent}
.up span::before{transform:rotate(-90deg)} .dn span::before{transform:rotate(90deg)} .lf span::before{transform:rotate(180deg)}
/* hand */
.hand{display:flex;justify-content:center;align-items:flex-end;padding-bottom:calc(var(--s))}
.c{width:calc(var(--t)*1.02);height:calc(var(--t)*1.44);border-radius:15px;background:var(--card);
  margin:0 -6px;position:relative;box-shadow:0 6px 12px rgba(90,70,40,.24),inset 0 -5px 0 rgba(0,0,0,.09);
  display:grid;place-items:center}
.c:nth-child(1){transform:rotate(-6deg)} .c:nth-child(3){transform:rotate(6deg)}
.c.sel{transform:translateY(-20px) rotate(0);box-shadow:0 12px 20px rgba(90,70,40,.30),0 0 0 3.5px var(--white),inset 0 -5px 0 rgba(0,0,0,.09)}
.c.spent{background:#cdc7b6;opacity:.55;box-shadow:none}
.num{position:absolute;top:7px;left:7px;background:var(--white);color:#8a6236;font-weight:900;
  font-size:calc(var(--t)*.30);line-height:1;padding:3px 8px;border-radius:8px}
.gl{width:56%;height:3.5px;background:rgba(255,255,255,.9);border-radius:3px;position:relative;margin-top:16%}
.gl::after{content:"";position:absolute;right:-3px;top:-5px;border-left:11px solid rgba(255,255,255,.9);
  border-top:7px solid transparent;border-bottom:7px solid transparent}
</style></head><body>
<div class="top">
  <div class="lvl">3</div>
  <div class="rs"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v6h-6"/></svg>2</div>
</div>
<div class="stage"><div class="board">
  <div class="tile"></div><div class="tile"></div><div class="tile wall"></div><div class="tile"></div><div class="tile"></div>
  <div class="tile"></div><div class="tile arw up"><span></span></div><div class="tile"></div><div class="tile sand"></div><div class="tile"></div>
  <div class="tile arw lf"><span></span></div><div class="tile"><div class="ball"></div></div><div class="tile arw"><span></span></div><div class="tile"></div><div class="tile hole"><div class="flag"></div></div>
  <div class="tile"></div><div class="tile arw dn"><span></span></div><div class="tile wall"></div><div class="tile slope"></div><div class="tile"></div>
</div></div>
<div class="hand">
  <div class="c spent"><div class="num">1</div><div class="gl"></div></div>
  <div class="c sel"><div class="num">3</div><div class="gl"></div></div>
  <div class="c"><div class="num">2</div><div class="gl"></div></div>
</div>
</body></html>
