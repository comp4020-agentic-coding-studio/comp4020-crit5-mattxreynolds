<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A-iso — Floating stage, isometric</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* one knob: tile width in screen px. h = w/2 (2:1 iso), d = slab depth */
  --w:min(calc((100vw - 48px)/4.5), calc((100vh - 360px)/2.6), 208px);
  --hw:calc(var(--w)/2); --h:calc(var(--w)/2); --hh:calc(var(--w)/4);
  --d:calc(var(--w)*0.13); --dw:calc(var(--w)*0.29);   /* ground slab / wall slab */
  --ink:#3c4a38; --card:#dfa561; --red:#d64a3c; --white:#fdfdfa; --s:8px;
}
html,body{height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#e6f1e8 0%,#eef2e6 46%,#f8f2e6 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(var(--s)*3) var(--s) calc(var(--s)*2);overflow:hidden}
.top-bar{width:min(760px,100%);display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--s)*1.5)}
.lvl{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.6);display:grid;place-items:center;font-weight:900;font-size:19px;color:#5b6b55}
.rs{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px;color:#7d8a76}
.rs svg{width:20px;height:20px;fill:none;stroke:#7d8a76;stroke-width:2.4;stroke-linecap:round}
.stage{flex:1;display:grid;place-items:center;width:100%}
/* board: tiles placed by grid coords, no 3D transform anywhere */
.board{position:relative;
  width:calc(var(--w)*4.5);
  height:calc(var(--hh)*7 + var(--h) + var(--d));
  filter:drop-shadow(0 18px 26px rgba(70,90,66,.20))}
.t{position:absolute;z-index:calc(var(--r) + var(--c));--dd:var(--d);
  left:calc((var(--c) - var(--r)) * var(--hw) + var(--hw)*3);
  top:calc((var(--c) + var(--r)) * var(--hh) - (var(--dd) - var(--d)));
  width:var(--w);height:calc(var(--h) + var(--dd))}
.top,.fl,.fr,.fx{position:absolute}
.fx{left:0;top:0;width:var(--w);height:var(--h);z-index:2}
.top{left:0;top:0;width:var(--w);height:var(--h);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.fl{left:0;top:var(--hh);width:var(--hw);height:calc(var(--hh) + var(--dd));
  clip-path:polygon(0 0,100% 50%,100% 100%,0 50%)}
.fr{left:var(--hw);top:var(--hh);width:var(--hw);height:calc(var(--hh) + var(--dd));
  clip-path:polygon(0 50%,100% 0,100% 50%,0 100%)}
/* terrain */
.hl .top{background:#d3e3c8}
.gr .top{background:#b6ccab}.gr .fl{background:#94ac8a}.gr .fr{background:#84997a}
.wl{--dd:var(--dw)}
.wl .top{background:#8ba580}.wl .fl{background:#6e8664}.wl .fr{background:#5e7556}
.sd .top{background:#eddcae}.sd .fl{background:#cbb98b}.sd .fr{background:#b9a67b}
.sd .top{background:#eddcae radial-gradient(circle,rgba(180,150,90,.5) 1.4px,transparent 1.8px) 0 0/10px 10px}
.sl .top{background:#b6ccab}.sl .fl{background:#94ac8a}.sl .fr{background:#84997a}
/* things that lie flat in the ground plane get the 2:1 iso matrix */
.pl{position:absolute;left:50%;top:50%;width:var(--w);height:var(--w);
  margin:calc(var(--w)/-2) 0 0 calc(var(--w)/-2);
  transform:matrix(1,.5,-1,.5,0,0);display:grid;place-items:center}
.ch,.tri{display:block;width:0;height:0}
.ch{position:relative;border-left:calc(var(--w)*.20) solid rgba(255,255,255,.70);
  border-top:calc(var(--w)*.17) solid transparent;border-bottom:calc(var(--w)*.17) solid transparent;
  margin-left:calc(var(--w)*-.10)}
.ch::after{content:"";position:absolute;left:calc(var(--w)*.02);top:calc(var(--w)*-.17);
  border-left:calc(var(--w)*.20) solid rgba(255,255,255,.70);
  border-top:calc(var(--w)*.17) solid transparent;border-bottom:calc(var(--w)*.17) solid transparent}
.t:has(.ar) .top{background:#d3e3c8}
.ar{transform:matrix(1,.5,-1,.5,0,0) rotate(var(--rot))}
.tri{border-left:calc(var(--w)*.26) solid rgba(56,72,52,.86);
  border-top:calc(var(--w)*.18) solid transparent;border-bottom:calc(var(--w)*.18) solid transparent}
/* things that stand upright */
.cup{position:absolute;left:50%;top:50%;width:calc(var(--w)*.40);height:calc(var(--w)*.20);
  transform:translate(-50%,-50%);border-radius:50%;background:#41513c;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.flag{position:absolute;left:calc(50% + var(--w)*.02);bottom:50%;width:calc(var(--w)*.018);
  min-width:2px;height:calc(var(--w)*.46);background:#4a4a46;border-radius:2px;z-index:9}
.flag::after{content:"";position:absolute;left:100%;top:0;
  border-left:calc(var(--w)*.22) solid var(--red);
  border-top:calc(var(--w)*.085) solid transparent;border-bottom:calc(var(--w)*.085) solid transparent}
.shdw{position:absolute;left:50%;top:50%;width:calc(var(--w)*.34);height:calc(var(--w)*.17);
  transform:translate(-50%,-30%);border-radius:50%;background:rgba(60,80,56,.26)}
.ball{position:absolute;left:50%;top:50%;width:calc(var(--w)*.30);height:calc(var(--w)*.30);
  transform:translate(-50%,-72%);border-radius:50%;background:var(--white);z-index:8;
  box-shadow:inset -2px -3px 5px rgba(80,95,76,.20)}
/* hand — unchanged from direction A */
.hand{display:flex;justify-content:center;align-items:flex-end;padding-bottom:var(--s)}
.c{width:calc(var(--w)*.62);height:calc(var(--w)*.87);border-radius:15px;background:var(--card);
  margin:0 -6px;position:relative;box-shadow:0 6px 12px rgba(90,70,40,.24),inset 0 -5px 0 rgba(0,0,0,.09);
  display:grid;place-items:center}
.c:nth-child(1){transform:rotate(-6deg)}.c:nth-child(3){transform:rotate(6deg)}
.c.sel{transform:translateY(-20px) rotate(0);box-shadow:0 12px 20px rgba(90,70,40,.30),0 0 0 3.5px var(--white),inset 0 -5px 0 rgba(0,0,0,.09)}
.c.spent{background:#cdc7b6;opacity:.55;box-shadow:none}
.num{position:absolute;top:7px;left:7px;background:var(--white);color:#8a6236;font-weight:900;
  font-size:calc(var(--w)*.18);line-height:1;padding:3px 8px;border-radius:8px}
.gl{width:56%;height:3.5px;background:rgba(255,255,255,.9);border-radius:3px;position:relative;margin-top:16%}
.gl::after{content:"";position:absolute;right:-3px;top:-5px;border-left:11px solid rgba(255,255,255,.9);
  border-top:7px solid transparent;border-bottom:7px solid transparent}
</style></head><body>
<div class="top-bar">
  <div class="lvl">3</div>
  <div class="rs"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v6h-6"/></svg>2</div>
</div>
<div class="stage"><div class="board">
  <div class="t gr" style="--r:0;--c:0"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div>
  <div class="t gr" style="--r:0;--c:1"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div>
  <div class="t wl" style="--r:0;--c:2"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div>
  <div class="t gr" style="--r:0;--c:3"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div>
  <div class="t gr" style="--r:0;--c:4"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div>
  <div class="t gr" style="--r:1;--c:0"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div>
  <div class="t gr" style="--r:1;--c:1"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"><div class="pl ar" style="--rot:270deg"><i class="tri"></i></div></div></div>
  <div class="t gr" style="--r:1;--c:2"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div>
  <div class="t sd" style="--r:1;--c:3"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div>
  <div class="t gr" style="--r:1;--c:4"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div>
  <div class="t gr" style="--r:2;--c:0"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"><div class="pl ar" style="--rot:180deg"><i class="tri"></i></div></div></div>
  <div class="t gr" style="--r:2;--c:1"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"><div class="shdw"></div><div class="ball"></div></div></div>
  <div class="t gr" style="--r:2;--c:2"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"><div class="pl ar" style="--rot:0deg"><i class="tri"></i></div></div></div>
  <div class="t gr" style="--r:2;--c:3"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div>
  <div class="t gr" style="--r:2;--c:4"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"><div class="cup"></div><div class="flag"></div></div></div>
  <div class="t gr" style="--r:3;--c:0"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div>
  <div class="t gr" style="--r:3;--c:1"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"><div class="pl ar" style="--rot:90deg"><i class="tri"></i></div></div></div>
  <div class="t wl" style="--r:3;--c:2"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div>
  <div class="t sl" style="--r:3;--c:3"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"><div class="pl"><i class="ch"></i></div></div></div>
  <div class="t gr" style="--r:3;--c:4"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div>
</div></div>
<div class="hand">
  <div class="c spent"><div class="num">1</div><div class="gl"></div></div>
  <div class="c sel"><div class="num">3</div><div class="gl"></div></div>
  <div class="c"><div class="num">2</div><div class="gl"></div></div>
</div>
</body></html>
