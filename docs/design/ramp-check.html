<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Ramp orientations</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#3c4a38;--card:#dfa561;--red:#d64a3c;--white:#fdfdfa;--s:8px;--cw:clamp(62px,8.6vmin,112px)}
html,body{height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#e6f1e8 0%,#eef2e6 46%,#f8f2e6 100%)}
.screen{display:none;position:relative;height:100%;flex-direction:column;align-items:center;
  justify-content:center;gap:clamp(22px,4.5vmin,60px);padding:calc(var(--s)*3) var(--s) calc(var(--s)*2)}
.screen.on{display:flex}
.top-bar{position:absolute;top:calc(var(--s)*3);left:50%;transform:translateX(-50%);
  width:min(760px,calc(100% - var(--s)*2));display:flex;align-items:center;justify-content:space-between;
  padding:0 calc(var(--s)*1.5);z-index:30}
.lvl{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.6);display:grid;place-items:center;font-weight:900;font-size:19px;color:#5b6b55}
.rs{display:flex;align-items:center;gap:7px;border:0;cursor:pointer;border-radius:999px;
  background:rgba(255,255,255,.62);padding:9px 15px 9px 12px;color:#6f7d69;font:inherit;font-weight:800;font-size:17px;
  box-shadow:0 2px 6px rgba(70,90,66,.10);transition:background .15s,transform .15s}
.rs:hover{background:rgba(255,255,255,.95);transform:translateY(-1px)}
.rs svg,.redo svg{fill:none;stroke-width:2.4;stroke-linecap:round}
.rs svg{width:21px;height:21px;stroke:#6f7d69}
.stage{flex:0 0 auto;display:grid;place-items:center;width:100%;position:relative}
.b33{--w:min(calc((100vw - 96px)/3), calc((100vh - 300px)/1.800), 208px)}
.b54{--w:min(calc((100vw - 96px)/4.5), calc((100vh - 300px)/2.550), 208px)}
@media (max-width:700px){.b33{--w:min(calc((100vw - 22px)/3), calc((100vh - 250px)/1.800), 150px)}}
@media (max-width:700px){.b54{--w:min(calc((100vw - 22px)/4.5), calc((100vh - 250px)/2.550), 150px)}}
/* ---- isometric board ------------------------------------------------------
   tile (r,c) -> x=(c-r)*w/2, y=(c+r)*w/4, paint order z=r+c.
   Each tile is three clip-path faces. Every face corner is an explicit length,
   not a percentage: percentages are relative to differing face-box heights, so
   ground and wall skirts drew at different angles and the board's bottom edge
   came out ragged. Explicit lengths also let a corner be raised (--rn/e/s/w),
   which is what makes a slope an actually tilted plane.                     */
.board{position:relative;--lift:calc(var(--w)*0.30);
  --hw:calc(var(--w)/2);--h:calc(var(--w)/2);--hh:calc(var(--w)/4);
  --d:calc(var(--w)*0.13);--dw:calc(var(--w)*0.30);--rise:calc(var(--w)*0.17);
  width:calc(var(--w)*(var(--cols) + var(--rows))/2);
  height:calc(var(--hh)*(var(--cols) + var(--rows) - 2) + var(--h) + var(--d));
  filter:drop-shadow(0 18px 26px rgba(70,90,66,.20));transition:opacity .3s,filter .3s}
.board.dim{opacity:.34;filter:blur(1.5px) drop-shadow(0 18px 26px rgba(70,90,66,.12))}
.t{position:absolute;z-index:calc(var(--r) + var(--c));
  --lv:0;--dd:calc(var(--d) + var(--lv)*var(--lift));--rn:0px;--re:0px;--rs:0px;--rw:0px;--rmax:0px;
  left:calc((var(--c) - var(--r)) * var(--hw) + var(--hw)*(var(--rows) - 1));
  top:calc((var(--c) + var(--r)) * var(--hh) - (var(--dd) - var(--d)) - var(--rmax));
  width:var(--w);height:calc(var(--h) + var(--dd) + var(--rmax))}
.top,.fl,.fr,.fx{position:absolute}
/* Every corner of the tile solid, as a y-offset inside the tile box. The two
   skirts then start at whichever of their corners is highest (min()), so a ramp
   works in all four directions -- raising the south corner, where both skirts
   meet, used to push a clip-path coordinate negative and drop the face. */
.t{
  --yN:calc(var(--rmax) - var(--rn));
  --yE:calc(var(--hh) + var(--rmax) - var(--re));
  --yS:calc(var(--h)  + var(--rmax) - var(--rs));
  --yW:calc(var(--hh) + var(--rmax) - var(--rw));
  --yEb:calc(var(--hh) + var(--rmax) + var(--dd));
  --yWb:calc(var(--hh) + var(--rmax) + var(--dd));
  --ySb:calc(var(--h)  + var(--rmax) + var(--dd));
  --tl:min(var(--yW), var(--yS));
  --tr:min(var(--yS), var(--yE));
  --poly:polygon(50% var(--yN), 100% var(--yE), 50% var(--yS), 0 var(--yW))}
/* the top face is drawn twice: the outer diamond is the seam colour, the inner
   one (scaled down) is the fill. Without a visible tile edge the green reads as
   one slab, and a card marked "2" has nothing countable to refer to. */
.top{left:0;top:0;width:var(--w);height:calc(var(--h) + var(--rmax));clip-path:var(--poly)}
.top::after{content:"";position:absolute;inset:0;clip-path:var(--poly);transform:scale(.962)}
.fl{left:0;top:var(--tl);width:var(--hw);height:calc(var(--ySb) - var(--tl));
  clip-path:polygon(
    0    calc(var(--yW)  - var(--tl)),
    100% calc(var(--yS)  - var(--tl)),
    100% calc(var(--ySb) - var(--tl)),
    0    calc(var(--yWb) - var(--tl)))}
.fr{left:var(--hw);top:var(--tr);width:var(--hw);height:calc(var(--ySb) - var(--tr));
  clip-path:polygon(
    0    calc(var(--yS)  - var(--tr)),
    100% calc(var(--yE)  - var(--tr)),
    100% calc(var(--yEb) - var(--tr)),
    0    calc(var(--ySb) - var(--tr)))}
.fx{left:0;top:var(--rmax);width:var(--w);height:var(--h);z-index:2}
/* terrain */
.gr .top{background:#a3bb98}
.gr .top::after{background:#b6ccab}.gr .fl{background:#94ac8a}.gr .fr{background:#84997a}
.wl{--dd:var(--dw)}
.wl .top{background:#7b9670}
.wl .top::after{background:#8ba580}.wl .fl{background:#6e8664}.wl .fr{background:#5e7556}
.sd .top{background:#dbc899}
.sd .top::after{background:#eddcae radial-gradient(circle,rgba(180,150,90,.5) 1.4px,transparent 1.8px) 0 0/10px 10px}
.sd .fl{background:#cbb98b}.sd .fr{background:#b9a67b}
/* a slope is a tilted plane: two adjacent corners raised, lit along the fall line */
.sl{--rmax:var(--rise)}
.sl .fl{background:#94ac8a}.sl .fr{background:#84997a}
.sl-pc{--rn:var(--rise);--rw:var(--rise)}
.sl-nc{--re:var(--rise);--rs:var(--rise)}
.sl-pr{--rn:var(--rise);--re:var(--rise)}
.sl-nr{--rs:var(--rise);--rw:var(--rise)}
.sl .top{background:#9db492}
.sl-pc .top::after{background:linear-gradient(150deg,#cfe0c3 0%,#a6bd9b 100%)}
.sl-nc .top::after{background:linear-gradient(330deg,#cfe0c3 0%,#a6bd9b 100%)}
.sl-pr .top::after{background:linear-gradient(210deg,#cfe0c3 0%,#a6bd9b 100%)}
.sl-nr .top::after{background:linear-gradient(30deg,#cfe0c3 0%,#a6bd9b 100%)}
/* direction arrows appear only once a card is held */
.pl{position:absolute;left:50%;top:50%;width:var(--w);height:var(--w);
  margin:calc(var(--w)/-2) 0 0 calc(var(--w)/-2);
  transform:matrix(1,.5,-1,.5,0,0);display:grid;place-items:center}
.pl.ar{display:none;transform:matrix(1,.5,-1,.5,0,0) rotate(var(--rot))}
.armed .pl.ar{display:grid}
.armed .t:has(.ar) .top{background:#bcd2b0}
.armed .t:has(.ar) .top::after{background:#d3e3c8}
.tri{display:block;width:0;height:0;border-left:calc(var(--w)*.26) solid rgba(56,72,52,.86);
  border-top:calc(var(--w)*.18) solid transparent;border-bottom:calc(var(--w)*.18) solid transparent}
/* upright props */
.cup{position:absolute;left:50%;top:50%;width:calc(var(--w)*.40);height:calc(var(--w)*.20);
  transform:translate(-50%,-50%);border-radius:50%;background:#41513c;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.flag{position:absolute;left:calc(50% + var(--w)*.02);bottom:50%;width:calc(var(--w)*.018);min-width:2px;
  height:calc(var(--w)*.46);background:#4a4a46;border-radius:2px;z-index:9}
.flag::after{content:"";position:absolute;left:100%;top:0;border-left:calc(var(--w)*.22) solid var(--red);
  border-top:calc(var(--w)*.085) solid transparent;border-bottom:calc(var(--w)*.085) solid transparent}
.shdw{position:absolute;left:50%;top:50%;width:calc(var(--w)*.34);height:calc(var(--w)*.17);
  transform:translate(-50%,-30%);border-radius:50%;background:rgba(60,80,56,.26)}
.ball{position:absolute;left:50%;top:50%;width:calc(var(--w)*.30);height:calc(var(--w)*.30);
  transform:translate(-50%,-72%);border-radius:50%;background:var(--white);z-index:8;
  box-shadow:inset -2px -3px 5px rgba(80,95,76,.20)}
/* hand */
.hand{display:flex;justify-content:center;align-items:flex-end;padding-bottom:var(--s)}
.c{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:15px;background:var(--card);margin:0 -6px;position:relative;
  border:0;font:inherit;cursor:pointer;box-shadow:0 6px 12px rgba(90,70,40,.24),inset 0 -5px 0 rgba(0,0,0,.09);
  display:grid;place-items:center;transition:transform .16s,box-shadow .16s}
.c:nth-child(1){transform:rotate(-6deg)}.c:nth-child(3){transform:rotate(6deg)}
.hand .c:only-child{transform:none}
.c.sel{transform:translateY(-20px) rotate(0)!important;
  box-shadow:0 12px 20px rgba(90,70,40,.30),0 0 0 3.5px var(--white),inset 0 -5px 0 rgba(0,0,0,.09)}
.c.spent{background:#cdc7b6;opacity:.55;box-shadow:none;cursor:default}
.num{position:absolute;top:7px;left:7px;background:var(--white);color:#8a6236;font-weight:900;
  font-size:calc(var(--cw)*.30);line-height:1;padding:3px 8px;border-radius:8px}
.gl{width:56%;height:3.5px;background:rgba(255,255,255,.9);border-radius:3px;position:relative;margin-top:16%}
.gl::after{content:"";position:absolute;right:-3px;top:-5px;border-left:11px solid rgba(255,255,255,.9);
  border-top:7px solid transparent;border-bottom:7px solid transparent}
/* end-of-level card. Deliberately NOT a <dialog>, no role=dialog and no "modal"
   in any class or id -- spec/crit-5.test.ts fails all of those -- and no words. */
.endcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--s)*4);z-index:20}
.endcard .c{transform:none!important}
.endcard .c.spent{opacity:1;background:#bdb7a6;box-shadow:0 4px 10px rgba(90,70,40,.16)}
.endcard .c.spent .num{background:#efece2;color:#8b8677}
.redo{width:clamp(64px,9vmin,96px);aspect-ratio:1;border:0;border-radius:50%;background:var(--card);cursor:pointer;
  display:grid;place-items:center;box-shadow:0 8px 16px rgba(90,70,40,.30),inset 0 -5px 0 rgba(0,0,0,.10)}
.redo svg{width:52%;height:52%;stroke:var(--white)}
</style><style>
body{display:block;padding:30px}
.wrap{display:flex;gap:56px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
figure{margin:0} figcaption{font:600 13px Nunito,sans-serif;color:#5b6b55;margin-bottom:14px;letter-spacing:.1em}
.board{--w:130px}
</style></head><body><div class="wrap"><figure><figcaption>sl-pc</figcaption><div class="board b33" style="--cols:3;--rows:3"><div class="t gr" style="--r:0;--c:0;--lv:1"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div><div class="t gr" style="--r:0;--c:1;--lv:0"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div><div class="t gr" style="--r:0;--c:2;--lv:0"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div><div class="t gr" style="--r:1;--c:0;--lv:1"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div><div class="t sl sl-pc" style="--r:1;--c:1;--lv:0;--rise:var(--lift)"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div><div class="t gr" style="--r:1;--c:2;--lv:0"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div><div class="t gr" style="--r:2;--c:0;--lv:1"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div><div class="t gr" style="--r:2;--c:1;--lv:0"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div><div class="t gr" style="--r:2;--c:2;--lv:0"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div></div></figure><figure><figcaption>sl-nc</figcaption><div class="board b33" style="--cols:3;--rows:3"><div class="t gr" style="--r:0;--c:0;--lv:0"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div><div class="t gr" style="--r:0;--c:1;--lv:0"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div><div class="t gr" style="--r:0;--c:2;--lv:1"><div class="fl"></div><div class="fr"></div><div class="top"></div><div class="fx"></div></div><div class="t gr" style="--r:1;--c:0;--lv:0"><div class="fl"></div>
